server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mọi route không match static file → trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset hashed của Vite
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Tắt cache cho index.html để FE deploy mới có hiệu lực ngay
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
